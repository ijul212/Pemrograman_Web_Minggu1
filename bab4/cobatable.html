<!DOCTYPE html>
<html>

<head>
    <title>table</title>
</head>

<body>
    <h2>Contoh tabel</h2>
    <p>Untuk membuat sel lebih dari satu kolom, gunakan
        atribut <i>colspan</i>.</p>
    <table border="1" width="40%">
        <tr>
            <th colspan="2">Name</th>
            <th>Age</th>
        </tr>
        <tr>
            <td>Jill</td>
            <td>Smith</td>
            <td>43</td>
        </tr>
        <tr>
            <td>Eve</td>
            <td>Jackson</td>
            <td>57</td>
        </tr>
    </table>
</body>

</html>
