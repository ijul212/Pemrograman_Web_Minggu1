<html lang="en">

<head>
    <title>Layout with Iframes</title>
    <style>
        body,
        html {
            height: 100%;
            margin: 0;
            display:
                flex;
            flex-direction: column;
        }

        .header {
            height: 20%;
        }

        .content {
            height: 80%;
            display: flex;
        }

        .menu {
            width: 25%;
        }

        .main {
            width: 75%;
        }

        iframe {
            border: none;
            width: 100%;
            height:
                100%;
        }
    </style>
</head>

<body>
    <div class="header"><iframe src="judul.html"></iframe></div>
    <div class="content">
        <div class="menu"><iframe src="menu.html" scrolling="no"></iframe></div>
        <div class="main"><iframe src="isi.html" scrolling="no"></iframe></div>
    </div>
</body>

</html>
