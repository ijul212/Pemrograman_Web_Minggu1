<!DOCTYPE html>
<html>

<head>
    <title>table1</title>
</head>

<body>
    <h2>Kita dapat tambahkan styling pada table</h2>
    <table width=50% style="border: 1px solid blue; border-collapse: collapse;;">
        <tr bgcolor="cyan">
            <th colspan="2">Name</th>
            <th>Age</th>
        </tr>
        <tr>
            <td>Jill</td>
            <td>Smith</td>
            <td>43</td> 
        </tr>
        <tr>
            <td>Eve</td>
            <td>Jackson</td>
            <td>57</td>
        </tr>
    </table>
</body>

</html>
