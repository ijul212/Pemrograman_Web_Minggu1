<html>

<head> </head>
<script language="Javascript">
    function test() {
        var kode = document.kirim.T1.value;
        if (kode == "A001") {
            document.kirim.T2.value = "Televisi";
            document.kirim.T3.value = "4500000";
        } else if (kode == "A002") {
            document.kirim.T2.value = "Radio";
            document.kirim.T3.value = "500000";
        } else {
            document.kirim.T2.value = "Kulkas";
            document.kirim.T3.value = "6000000";
        }
    }
</script>

<body>
    <form method="POST" name="kirim">
        <table>
            <tr>
                <td>Kode Barang</td>
                <td><input type="text" name="T1" size="10"></td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="button" value="TEBAK" name="B1" onclick="test()">
                </td>
            </tr>
            <tr>
                <td>Nama Barang</td>
                <td><input type="text" name="T2" size="30"></td>
            </tr>
            <tr>
                <td>Harga Barang</td>
                <td><input type="text" name="T3" size="10"></td>
            </tr>
        </table>
    </form>
</body>

</html>
